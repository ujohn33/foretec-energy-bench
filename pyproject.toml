[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foretec-live"
version = "0.1.0"
description = "Open daily forecasting benchmark for day-ahead price, wind and solar in FR, NL and BE"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "sktime>=1.2,<1.3",
  "pandas>=2.1",
  "numpy",
  "pyarrow",
  "pyyaml",
  "requests",
  "lightgbm",
  "statsmodels",
]

[project.optional-dependencies]
# Foundation models pull heavy, sometimes conflicting deps (torch, transformers).
# Install one family per environment; see README.
chronos = ["chronos-forecasting>=2.0.0"]
entsoe = ["entsoe-py"]
dev = ["pytest"]

[project.scripts]
foretec-live = "foretec_live.cli:main"

[tool.setuptools.packages.find]
include = ["foretec_live*"]

[tool.setuptools.package-data]
foretec_live = ["web/*"]
