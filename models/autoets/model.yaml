name: autoets
author: Foretec
description: "AutoETS (StatsForecast, through sktime): exponential smoothing with additive error and additive daily season (96 quarter-hours), trend chosen by AICc. Fully automatic selection picked multiplicative seasons that diverged on solar (BE solar forecast 15,000 MW against ~1,500 MW actual in tests), so error and season are fixed additive."
family: baseline
runner: subprocess
env: stats
script: ../_shared/fl_sktime.py
estimator: StatsForecastAutoETS
params: {season_length: 96, model: AZA}
n_jobs: 4
enabled: false
retired: "Retired 14 Oct 2026: classical univariate models (ARIMA, ETS, Theta, CES, TBATS) are not meaningful on 15-minute data with a 96-step daily cycle; the classical benchmark is now linear regression on the lag pipeline (lin_lags) and on the covariates (lin_cov). Results up to 13 Oct stay public."
hidden: true   # left out of the website entirely (results kept on disk)
