name: tso_final
author: RTE, Elia, ENTSO-E / TSOs
description: "Reference, not ranked: the TSOs' final day-ahead wind and solar forecast, published after the 12:00 gate. FR: RTE's day-ahead forecast published at 16:15 on D-1 (RTE Generation Forecast API); BE: Elia's day-ahead forecast published at 18:00 on D-1 (Elia Open Data, 15 minutes; ENTSO-E only has it hourly). Fetched at the afternoon scoring runs; backtest uses the published version. NL is left out: the NL actuals are NED's national estimates, while TenneT's ENTSO-E forecasts cover a narrower scope."
family: tso
inputs: [tso_forecast]
targets: [wind, solar]
reference: true
# NL actuals are NED's national estimates; TenneT's ENTSO-E forecasts cover a narrower (metered) scope
exclude: [NL_wind, NL_solar]
runner: subprocess
env: _self
script: forecaster.py
