name: tso_final
author: RTE, ENTSO-E / TSOs
description: "Reference, not ranked: the TSOs' final day-ahead wind and solar forecast, published after the 12:00 gate. FR: RTE's day-ahead forecast published at 16:15 on D-1 (RTE Generation Forecast API); BE and NL: ENTSO-E A69, which may be published until 18:00 on D-1. Fetched at the afternoon scoring runs; backtest uses the published version. NL solar is left out: TenneT forecasts national output, but its published actual covers metered plants only."
family: tso
inputs: [tso_forecast]
targets: [wind, solar]
reference: true
# TenneT forecasts national solar, but its published actual covers metered plants only (~200 vs ~3,000 MW peak)
exclude: [NL_solar]
runner: subprocess
env: _self
script: forecaster.py
