name: t0_gamma_cov
author: The Forecasting Company
description: "The Forecasting Company t0-gamma, zero-shot with known-future covariates (NWP ensemble means and spreads, ENTSO-E load forecast (price only), fuel cost) over the history and the delivery day. Runs on tfc-t0 0.6.0, which its weights require."
family: t0
inputs: [history, nwp, load_forecast, fuel]
runner: subprocess
env: tfc06
script: forecaster.py
