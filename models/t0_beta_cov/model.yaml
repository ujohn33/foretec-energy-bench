name: t0_beta_cov
author: The Forecasting Company
description: "The Forecasting Company t0-beta, zero-shot with known-future covariates (NWP ensemble means and spreads, ENTSO-E load forecast (price only), fuel cost) over the history and the delivery day."
family: t0
inputs: [history, nwp, load_forecast, fuel]
runner: subprocess
env: tfc
script: forecaster.py
enabled: false
retired: "20 Nov 2026: superseded by t0-gamma with covariates (t0_gamma_cov), which beat it in the live run over the 28 days to 19 Nov (mean pooled Rel. MAE): 0.365 against 0.414, at the same run time."
