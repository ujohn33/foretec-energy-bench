name: autoces
author: Foretec
description: "AutoCES (StatsForecast, through sktime): complex exponential smoothing (Svetunkov), which models level and potential in one complex-valued state, daily season of 96 quarter-hours."
family: baseline
runner: subprocess
env: stats
script: ../_shared/fl_sktime.py
estimator: StatsForecastAutoCES
params: {season_length: 96}
n_jobs: 4
enabled: false
retired: "Retired 14 Oct 2026: classical univariate models (ARIMA, ETS, Theta, CES, TBATS) are not meaningful on 15-minute data with a 96-step daily cycle; the classical benchmark is now linear regression on the lag pipeline (lin_lags) and on the covariates (lin_cov). Results up to 13 Oct stay public."
