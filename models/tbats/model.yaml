name: tbats
author: Foretec
description: "AutoTBATS (StatsForecast, through sktime): trigonometric seasonality, Box-Cox, ARMA errors, trend and damping chosen automatically, daily season of 96 quarter-hours."
family: baseline
runner: subprocess
env: stats
script: ../_shared/fl_sktime.py
estimator: StatsForecastAutoTBATS
params: {seasonal_periods: [96]}
n_jobs: 4
