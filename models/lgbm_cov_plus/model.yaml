name: lgbm_cov_plus
author: Foretec
description: "lgbm_cov_2y with what the backtest ablation (Oct 2026) found to matter: two years of NWP covariates, recency-weighted (half-life 120 days), one LightGBM per quantile; solar trained on its capacity factor (installed capacity from the Marktstammdatenregister, Elia and Energinet for DE-LU, BE, DK1, DK2; a recent-peak proxy for FR and NL), which removes capacity growth the trees cannot extrapolate; price and load retrained every day (through yesterday, overnight), wind and solar monthly. Ablation: daily retraining cut price and load error by 15-23 % against monthly; the capacity factor cut solar error by 12-27 %; tuning the LightGBM parameters gained nothing."
family: nwp
inputs: [history, nwp, load_forecast, fuel, calendar]
runner: subprocess
env: _self
script: ../_shared/fl_covmodel.py
regressor: lgbm
train_days: 730
half_life_days: 120
scale: {solar: capacity}
retrain: {price: daily, load: daily}
timeout: 3600
