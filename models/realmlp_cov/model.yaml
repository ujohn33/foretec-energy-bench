name: realmlp_cov
author: Holzmüller et al. (pytabkit)
description: "RealMLP (pytabkit RealMLP-TD, 64 epochs) on exactly the lgbm_cov inputs and window: the NWP ensemble, ENTSO-E load forecast, calendar (for price also wind/solar in all zones, fuel and yesterday's price), the 28 days before the cut-off. Trained in the morning on the window up to yesterday (outside the gate window), so the 11:30 run only predicts. Intervals from the residuals of the window's last 7 days per hour of day."
family: tabnn
inputs: [history, nwp, load_forecast, fuel, calendar]
runner: subprocess
env: tabnn
script: ../_shared/fl_tabnn.py
regressor: realmlp
pretrain: true
timeout: 7200
