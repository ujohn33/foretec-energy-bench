name: toto_cov
author: Foretec
description: Toto Open Base 1.0 zero-shot, covariates as extra variates with their known future values injected while decoding.
family: toto
inputs: [history, nwp, load_forecast, fuel]
runner: subprocess
env: toto
script: forecaster.py
enabled: false
retired: "Negligible gain in the 18-day backtest (rel. MAE 0.806 vs 0.819 without covariates) for ~4.5 min and ~4.6 GB per day. The released Toto weights have no trained exogenous labels."
