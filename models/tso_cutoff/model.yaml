name: tso_cutoff
author: Elia, NED.nl
description: "The grid operators' own day-ahead wind and solar forecasts as they stood before the gate. BE: Elia's forecast published at 11:00 on D-1 (Elia Open Data). NL: the NED.nl offshore wind forecast (Nationaal Energie Dashboard, backed by TenneT), fetched live at the cut-off; offshore only, because the NL wind actual on ENTSO-E is offshore plus a small TSO-metered onshore part (about 10%), while NED forecasts all onshore turbines. FR: none, because RTE publishes its next-day wind and solar forecast at 16:15 on D-1, after the gate, and offers no earlier (D-2) vintage for wind or solar. Live only: what was published before the gate cannot be verified after the fact, so there is no backtest. Point forecasts."
family: tso
inputs: [tso_forecast]
targets: [wind, solar]
zones: [BE, NL]
# NED forecasts national solar; the published NL actual covers metered plants only
exclude: [NL_solar]
# live only: a published 'as of 11:00' value cannot be verified after the fact, so no backtest
live_only: true
runner: subprocess
env: _self
script: forecaster.py
