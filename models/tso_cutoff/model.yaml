name: tso_cutoff
author: Elia, NED.nl
description: "The grid operators' own day-ahead wind, solar and load forecasts as they stood before the gate. BE: Elia's forecast published at 11:00 on D-1 (Elia Open Data). NL: the NED.nl national wind (onshore + offshore) and solar forecast (Nationaal Energie Dashboard, backed by TenneT), fetched live at the cut-off, the same quantity as the NL actuals (NED's national estimate). Load, every zone: the TSO's day-ahead total load forecast on ENTSO-E (A65), which must be published two hours before the gate. FR wind and solar: none, because RTE publishes its next-day wind and solar forecast at 16:15 on D-1, after the gate, and offers no earlier (D-2) vintage for wind or solar. Live only: what was published before the gate cannot be verified after the fact, so there is no backtest. Point forecasts."
family: tso
inputs: [tso_forecast]
targets: [wind, solar, load]
# FR wind/solar: RTE publishes its next-day forecast only at 16:15, after the gate.
exclude: [FR_wind, FR_solar]
# live only: a published 'as of 11:00' value cannot be verified after the fact, so no backtest
live_only: true
runner: subprocess
env: _self
script: forecaster.py
