name: tso_cutoff
author: Elia, NED.nl, ENTSO-E / TSOs
description: "The grid operators' own day-ahead wind, solar and load forecasts as they stood before the gate. BE: Elia's forecast published at 11:00 on D-1 (Elia Open Data), or, when that field is still empty at the run, Elia's most recent forecast read at the run, before the gate. NL: the NED.nl national wind (onshore + offshore) and solar forecast (Nationaal Energie Dashboard, backed by TenneT), fetched live at the cut-off, the same quantity as the NL actuals (NED's national estimate). Load in BE, FR, DE-LU, DK1 and DK2: the TSO's day-ahead total load forecast on ENTSO-E (A65), which must be published two hours before the gate. NL load: NED.nl's national load forecast, fetched live at the cut-off, the same gross consumption as the NL load actuals (TenneT's ENTSO-E forecast covers a different quantity). FR wind and solar: none, because RTE publishes its next-day wind and solar forecast at 16:15 on D-1, after the gate, and offers no earlier (D-2) vintage for wind or solar. Live only: what was published before the gate cannot be verified after the fact, so there is no backtest. Point forecasts."
family: tso
inputs: [tso_forecast]
targets: [wind, solar, load]
# FR wind/solar: RTE publishes its next-day forecast only at 16:15, after the gate.
# DE wind/solar: no TSO forecast before the gate (ENTSO-E A69 is due 18:00); DK: Energinet's day-ahead forecast
# is to be verified as published before 11:30 before it is used
exclude: [FR_wind, FR_solar, DE_wind, DE_solar, DK1_wind, DK1_solar, DK2_wind, DK2_solar]
# live only: a published 'as of 11:00' value cannot be verified after the fact, so no backtest
live_only: true
runner: subprocess
env: _self
script: forecaster.py
